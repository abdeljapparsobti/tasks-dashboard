<script>
/* =====================================================================
   إنجاز — Task & achievement dashboard (demo: data saved in this browser)
   Design references:
   - Shneiderman (1996): Overview first, zoom & filter, details on demand.
   - Amabile & Kramer, "The Progress Principle" (2011): visible progress on
     meaningful work is the strongest daily motivator → wins feed, progress.
   - Few / Tufte: direct labels, minimal non-data ink in charts.
   - WCAG 2.1 SC 1.4.1: status never conveyed by colour alone (icon + text).
   - Nielsen: progressive disclosure — the primary task first, secondary info below.
   - Hick–Hyman law: fewer simultaneous choices → faster decisions (3 KPIs, not 4).
   - Short, skippable, contextual onboarding tour (shown once).
   ===================================================================== */

/* ---------------- DATA ---------------- */
const TEAM = [
  { id:'u1', photo:'https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&crop=faces&w=160&h=160&q=80', name:'سعيد المنصوري', role:'مدير العمليات', initials:'سم', color:'bg-rose-100 text-rose-700' },
  { id:'u2', photo:'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&crop=faces&w=160&h=160&q=80', name:'يوسف بنعيسى',  role:'محاسب',          initials:'يب', color:'bg-sky-100 text-sky-700' },
  { id:'u3', photo:'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&crop=faces&w=160&h=160&q=80', name:'نبيل العمراني', role:'مسؤول التسويق',  initials:'نع', color:'bg-amber-100 text-amber-800' },
  { id:'u4', photo:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&crop=faces&w=160&h=160&q=80', name:'كريم الطاهري', role:'مطور برمجيات',     initials:'كط', color:'bg-emerald-100 text-emerald-700' },
  { id:'u5', photo:'https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&crop=faces&w=160&h=160&q=80', name:'هشام السلاوي', role:'مسؤول الموارد البشرية',  initials:'هس', color:'bg-violet-100 text-violet-700' },
];
const MANAGER = { id:'mgr', name:'المدير العام', initials:'م', color:'bg-brand-100 text-brand-700' };
const STATUS = {
  todo:  { label:'جديدة',        icon:'fa-regular fa-circle',        cls:'bg-ink-100 text-ink-700',         dot:'bg-ink-400' },
  doing: { label:'قيد التنفيذ',  icon:'fa-solid fa-circle-half-stroke', cls:'bg-sky-50 text-sky-700',        dot:'bg-sky-500' },
  done:  { label:'منجزة',        icon:'fa-solid fa-circle-check',    cls:'bg-emerald-50 text-emerald-700',  dot:'bg-emerald-500' },
};
const PRIORITY = {
  high: { label:'عالية',  icon:'fa-solid fa-angles-up',   cls:'text-red-700 bg-red-50',     rank:0 },
  med:  { label:'متوسطة', icon:'fa-solid fa-angle-up',    cls:'text-amber-800 bg-amber-50', rank:1 },
  low:  { label:'منخفضة', icon:'fa-solid fa-angle-down',  cls:'text-ink-700 bg-ink-100',    rank:2 },
};
const TAGS = ['عمليات', 'مالية', 'تسويق', 'تقنية', 'موارد بشرية'];

/* ---------------- HELPERS ---------------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const TODAY = () => ymd(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const num = n => Number(n).toLocaleString('ar-MA');
const person = id => TEAM.find(t => t.id === id) || MANAGER;
const fmtDay = s => parseYmd(s).toLocaleDateString('ar-MA', { weekday:'long', day:'numeric', month:'long' });
const fmtShort = s => parseYmd(s).toLocaleDateString('ar-MA', { day:'numeric', month:'short' });
function relDue(s) {
  const diff = Math.round((parseYmd(s) - parseYmd(TODAY())) / 864e5);
  if (diff === 0) return 'اليوم'; if (diff === 1) return 'غداً'; if (diff === -1) return 'أمس';
  if (diff < 0) return `منذ ${num(-diff)} أيام`; if (diff < 7) return `بعد ${num(diff)} أيام`;
  return fmtShort(s);
}
const isOverdue = t => t.status !== 'done' && t.due < TODAY();
function toast(msg, icon = 'fa-circle-check', color = 'text-emerald-400') {
  const t = $('#toast'); t.innerHTML = `<i class="fa-solid ${icon} ${color}"></i><span>${msg}</span>`;
  t.style.opacity = 1; clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2400);
}
function avatar(id, size = 'w-8 h-8 text-[11px]') {
  const p = person(id);
  const initials = `<span class="${size} ${p.color} rounded-full flex items-center justify-center font-bold shrink-0" title="${esc(p.name)}">${p.initials}</span>`;
  if (!p.photo) return initials;
  // profile photo with a status-ring look; falls back to initials if the image can't load
  return `<span class="relative ${size} shrink-0" title="${esc(p.name)}">
    <img src="${p.photo}" alt="${esc(p.name)}" loading="lazy" class="w-full h-full rounded-full object-cover ring-2 ring-white shadow-sm bg-ink-100"
      onerror="this.parentNode.outerHTML='${initials.replace(/"/g, '&quot;').replace(/'/g, "\\'")}'"></span>`;
}

/* ---------------- SEED ---------------- */
function seed() {
  const T = [
    ['إعداد تقرير المبيعات الشهري', 'u2', 'high', 'مالية', 0, 'doing', ['جمع بيانات الفروع', 'مراجعة الأرقام', 'إرسال للمدير']],
    ['مراجعة عقود الموردين', 'u1', 'high', 'عمليات', -1, 'todo', []],
    ['نشر حملة العروض على إنستغرام', 'u3', 'med', 'تسويق', 0, 'todo', ['تصميم 3 منشورات', 'كتابة النصوص', 'الجدولة']],
    ['إصلاح خطأ في صفحة الطلبات', 'u4', 'high', 'تقنية', 0, 'doing', []],
    ['مقابلات توظيف مساعد إداري', 'u5', 'med', 'موارد بشرية', 1, 'todo', ['فرز السير الذاتية', 'تحديد المواعيد']],
    ['تحديث جرد المخزون', 'u1', 'med', 'عمليات', -2, 'doing', []],
    ['دفع فواتير الكهرباء والإنترنت', 'u2', 'low', 'مالية', 2, 'todo', []],
    ['اجتماع تقييم أداء الربع', 'u5', 'high', 'موارد بشرية', 3, 'todo', []],
    ['تحسين سرعة الموقع', 'u4', 'low', 'تقنية', 5, 'todo', []],
    ['تجهيز عرض تقديمي للعميل الجديد', 'u3', 'high', 'تسويق', 1, 'doing', ['جمع دراسات الحالة', 'تصميم الشرائح']],
    ['تسجيل الموظفين الجدد في التأمين', 'u5', 'med', 'موارد بشرية', 0, 'todo', []],
    ['مطابقة كشف الحساب البنكي', 'u2', 'med', 'مالية', -1, 'todo', []],
  ];
  const now = new Date(), tasks = [];
  T.forEach(([title, a, p, tag, d, st, cl], i) => tasks.push({
    id: 't' + (i + 1), title, desc: '', assignee: a, priority: p, tag, due: ymd(addDays(now, d)), status: st,
    checklist: cl.map((x, k) => ({ t: x, done: st === 'doing' && k === 0 })), created: Date.now() - (i + 3) * 864e5, doneAt: null,
    createdBy: 'mgr', seen: [0, 2, 4, 9].includes(i) ? ['mgr'] : ['mgr', a], comments: [] }));
  // sample conversation on tasks (manager ↔ employee)
  const hr = h => Date.now() - h * 36e5;
  tasks[0].comments = [
    { by:'mgr', text:'أحتاج التقرير قبل اجتماع الغد، ركّز على مقارنة الفروع.', at: hr(20), readBy:['mgr','u2'] },
    { by:'u2',  text:'تمام، جمعت بيانات الفروع وأراجع الأرقام الآن.', at: hr(3), readBy:['u2'] } ];
  tasks[3].comments = [ { by:'u4', text:'وجدت سبب الخطأ، الإصلاح جاهز للاختبار.', at: hr(1), readBy:['u4'] } ];
  tasks[1].comments = [ { by:'mgr', text:'هذه المهمة متأخرة، هل تحتاج مساعدة؟', at: hr(5), readBy:['mgr'] } ];
  // completed history over the last 7 days (progress principle → visible wins)
  const doneT = ['إغلاق حسابات الأسبوع الماضي','تحديث سياسة الإجازات','إطلاق النشرة البريدية','نقل الخادم إلى استضافة جديدة','طلب مستلزمات المكتب',
    'تدريب الموظفين على النظام الجديد','إرسال عروض الأسعار للعملاء','تصميم شعار الحملة','مراجعة رواتب الشهر','إصلاح طابعة القسم المالي',
    'كتابة دليل استقبال الموظف','تنظيم أرشيف العقود','تحليل نتائج الإعلانات','تحديث بيانات العملاء','اجتماع الفريق الأسبوعي','إعداد ميزانية التسويق'];
  const perDay = [3, 2, 4, 1, 3, 2, 1];
  let k = 0;
  perDay.forEach((n, back) => { for (let j = 0; j < n && k < doneT.length; j++, k++) {
    const day = addDays(now, -6 + back), when = new Date(day); when.setHours(9 + j * 2, 15 * j, 0, 0);
    if (back === 6 && when > now) when.setTime(now - (j + 1) * 36e5);
    tasks.push({ id: 'd' + k, title: doneT[k], desc: '', assignee: TEAM[k % 5].id, priority: ['high','med','low'][k % 3], tag: TAGS[k % 5],
      due: ymd(day), status: 'done', checklist: [], created: when - 3 * 864e5, doneAt: when.getTime(),
      createdBy: 'mgr', seen: back === 6 ? [TEAM[k % 5].id] : ['mgr', TEAM[k % 5].id], comments: [] });
  } });
  return tasks;
}
let tasks = store.get('injaz_tasks2', null);
if (!tasks) { tasks = seed(); store.set('injaz_tasks2', tasks); }
const save = () => store.set('injaz_tasks2', tasks);

/* ---------------- STATE ---------------- */
let state = Object.assign({ view:'home', viewAs:'mgr', mode:'list', q:'', fAssignee:'all', fStatus:'open', fPriority:'all', fDue:'all' }, store.get('injaz_ui', {}));
const saveUi = () => store.set('injaz_ui', { view: state.view, viewAs: state.viewAs, mode: state.mode });
const scoped = () => state.viewAs === 'mgr' ? tasks : tasks.filter(t => t.assignee === state.viewAs);
const me = () => state.viewAs, isMgr = () => state.viewAs === 'mgr';
/* Permissions (least privilege): manager assigns & manages everything; employee works on own tasks */
const can = {
  edit: t => isMgr() || t.createdBy === me(),
  del:  t => isMgr() || t.createdBy === me(),
  assign: () => isMgr(),
};
/* Notifications: what changed for *this* user since they last looked */
function notifications() {
  const out = [], u = me();
  tasks.forEach(t => {
    const mine = isMgr() || t.assignee === u;
    if (!mine) return;
    const seen = t.seen || [u];
    if (!isMgr() && t.createdBy !== u && !seen.includes(u))

function metrics(list = scoped()) {
  const today = TODAY(), weekAgo = ymd(addDays(new Date(), -6));
  const open = list.filter(t => t.status !== 'done');
  const dueToday = list.filter(t => t.due === today);
  const doneToday = list.filter(t => t.status === 'done' && t.doneAt && ymd(new Date(t.doneAt)) === today);
  const overdue = list.filter(isOverdue);
  const weekDue = list.filter(t => t.due >= weekAgo && t.due <= today);
  const weekDone = weekDue.filter(t => t.status === 'done');
  const rate = weekDue.length ? Math.round(weekDone.length / weekDue.length * 100) : 0;
  return { open, dueToday, doneToday, overdue, rate, weekDue, weekDone };
}
function dailyDone(list = scoped(), days = 7) {
  const out = [];

    const d = ymd(addDays(new Date(), -i));

  }

}

/* ---------------- TASKS (Zoom & filter) ---------------- */
function filtered() {
  const q = state.q.trim(), today = TODAY(), weekEnd = ymd(addDays(new Date(), 6));
  return scoped().filter(t =>
    (!q || (t.title + ' ' + t.tag + ' ' + person(t.assignee).name).includes(q)) &&
    (state.fAssignee === 'all' || t.assignee === state.fAssignee) &&
    (state.fStatus === 'all' || (state.fStatus === 'open' ? t.status !== 'done' : t.status === state.fStatus)) &&
    (state.fPriority === 'all' || t.priority === state.fPriority) &&
    (state.fDue === 'all' || (state.fDue === 'today' && t.due === today) || (state.fDue === 'week' && t.due >= today && t.due <= weekEnd) || (state.fDue === 'overdue' && isOverdue(t)))
  ).sort(sortTasks);
}
function select(id, value, opts, label) {
  return `<label class="shrink-0"><span class="sr-only">${label}</span><select id="${id}" class="bg-white border border-ink-200 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-brand-500">
    ${opts.map(([v, l]) => `<option value="${v}" ${value === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`;
}
function renderTasks() {

          <button data-mode="board" class="px-3 rounded-lg ${state.mode === 'board' ? 'bg-white shadow-sm text-brand-700' : 'text-ink-500'}" ><i class="fa-solid fa-table-columns ml-1.5"></i><span class="text-xs font-bold">لوحة</span></button>
        </div>

      <div class="flex gap-2 overflow-x-auto no-scrollbar -mx-4 px-4 pb-1">

        ${select('fDue', state.fDue, [['all','الموعد: الكل'],['today','مستحقة اليوم'],['week','هذا الأسبوع'],['overdue','المتأخرة']], 'الموعد')}
        ${select('fPriority', state.fPriority, [['all','الأولوية: الكل'],['high','عالية'],['med','متوسطة'],['low','منخفضة']], 'الأولوية')}
        ${state.viewAs === 'mgr' ? select('fAssignee', state.fAssignee, [['all','الموظف: الكل'], ...TEAM.map(t => [t.id, t.name])], 'الموظف') : ''}
        ${active ? `<button data-action="clear" class="shrink-0 px-3 py-2 text-xs font-bold text-brand-700"><i class="fa-solid fa-xmark ml-1"></i>مسح الفلاتر</button>` : ''}

function listView(list) {

function boardView(list) {

          <div class="flex flex-wrap items-center gap-1.5 mb-2">${t.status !== 'done' ? chip(PRIORITY[t.priority]) : ''}${dueChip(t)}</div>

              ${k !== 'done' ? `<button data-move="${t.id}" data-to="${k === 'todo' ? 'doing' : 'done'}" class="h-7 px-2.5 rounded-lg ${k === 'todo' ? 'bg-sky-50 text-sky-700 hover:bg-sky-100' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'} text-[11px] font-bold">${k === 'todo' ? 'ابدأ' : 'أنجزت'}<i class="fa-solid fa-arrow-left text-[10px] mr-1"></i></button>` : ''}</div>

function bindDnD() {
  $$('[data-card]').forEach(c => c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.card); e.dataTransfer.effectAllowed = 'move'; }));
  $$('[data-col]').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drop-on'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop-on'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('drop-on'); setStatus(e.dataTransfer.getData('text/plain'), col.dataset.col); });
  });
}

/* ---------------- WINS (Progress principle) ---------------- */
function renderWins() {
  const list = scoped().filter(t => t.status === 'done' && t.doneAt).sort((a, b) => b.doneAt - a.doneAt);
  const byDay = {}; list.forEach(t => { const d = ymd(new Date(t.doneAt)); (byDay[d] = byDay[d] || []).push(t); });
  let streak = 0; for (let i = 0; i < 60; i++) { const d = ymd(addDays(new Date(), -i)); if (byDay[d]) streak++; else if (i > 0) break; }
  const month = list.filter(t => new Date(t.doneAt).getMonth() === new Date().getMonth()).length;
  $('#view').innerHTML = `
    <section class="grid grid-cols-3 gap-3 mb-5">
      <div class="bg-white border border-ink-200 rounded-2xl p-4 text-center"><div class="text-2xl mb-1">🔥</div><div class="text-xl font-bold">${num(streak)}</div><div class="text-[11px] text-ink-500">أيام متتالية من الإنجاز</div></div>
      <div class="bg-white border border-ink-200 rounded-2xl p-4 text-center"><div class="text-2xl mb-1">🏆</div><div class="text-xl font-bold">${num(month)}</div><div class="text-[11px] text-ink-500">إنجاز هذا الشهر</div></div>
      <div class="bg-white border border-ink-200 rounded-2xl p-4 text-center"><div class="text-2xl mb-1">✅</div><div class="text-xl font-bold">${num(list.length)}</div><div class="text-[11px] text-ink-500">إجمالي المنجز</div></div>
    </section>
    <section class="bg-white border border-ink-200 rounded-2xl p-5">
      <h3 class="font-bold mb-1">سجل الإنجازات</h3><p class="text-xs text-ink-500 mb-5">كل تقدم صغير يُحتسب — رؤية الإنجاز اليومي هي أقوى محفّز للفريق.</p>
      ${Object.keys(byDay).length ? Object.entries(byDay).map(([d, arr]) => `
        <div class="mb-5 last:mb-0">
          <div class="flex items-center gap-2 mb-2"><span class="text-xs font-bold ${d === TODAY() ? 'text-brand-700' : 'text-ink-700'}">${d === TODAY() ? 'اليوم' : fmtDay(d)}</span><span class="text-[11px] text-ink-500">• ${num(arr.length)} إنجاز</span><span class="flex-1 h-px bg-ink-200"></span></div>
          <ol class="border-r-2 border-emerald-200 pr-4 space-y-3">${arr.map(t => `
            <li class="relative"><span class="absolute -right-[23px] top-1 w-3 h-3 rounded-full bg-emerald-500 ring-4 ring-white"></span>
              <button data-open="${t.id}" class="text-right w-full flex items-center gap-3 hover:bg-ink-50 rounded-lg p-1 -m-1">
                <div class="flex-1 min-w-0"><div class="text-sm font-semibold">${esc(t.title)}</div>
                <div class="text-[11px] text-ink-500">${esc(person(t.assignee).name)} • ${new Date(t.doneAt).toLocaleTimeString('ar-MA', { hour:'2-digit', minute:'2-digit' })} • ${esc(t.tag)}</div></div>
                ${avatar(t.assignee, 'w-7 h-7 text-[10px]')}</button></li>`).join('')}</ol>
        </div>`).join('') : '<p class="text-sm text-ink-500 text-center py-8">لا إنجازات بعد. أنجز أول مهمة!</p>'}
    </section>`;
}

/* ---------------- ACTIONS ---------------- */
function setStatus(id, status) {
  const t = tasks.find(x => x.id === id); if (!t || t.status === status) return;
  const was = t.status; t.status = status; t.doneAt = status === 'done' ? Date.now() : null;
  if (status === 'done' && !isMgr()) t.seen = (t.seen || []).filter(x => x !== 'mgr');
  if (status === 'done') (t.checklist || []).forEach(c => c.done = true);
  save(); render(); if (drawerOpen()) openTask(id);
  if (status === 'done') { const n = metrics().doneToday.length; toast(`إنجاز جديد! ${num(n)} مهام أُنجزت اليوم 🎉`); }
  else if (was === 'done') toast('أُعيدت المهمة إلى قائمة العمل', 'fa-rotate-left', 'text-brand-200');
  else toast(`نُقلت إلى: ${STATUS[status].label}`, 'fa-arrow-left', 'text-brand-200');
}

  $('#drawerFoot').innerHTML = `<div class="flex gap-2">
    ${t.status !== 'done' ? `<button data-set="done" data-id="${t.id}" class="flex-1 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm"><i class="fa-solid fa-check ml-1.5"></i>تم الإنجاز</button>` : ''}
    ${can.edit(t) ? `<button data-edit="${t.id}" class="${t.status === 'done' ? 'flex-1' : ''} px-4 py-3 rounded-xl bg-ink-100 hover:bg-ink-200 font-bold text-sm"><i class="fa-solid fa-pen ml-1.5"></i>تعديل</button>` : ''}
    ${can.del(t) ? `<button data-del="${t.id}" class="px-4 py-3 rounded-xl bg-ink-100 hover:bg-red-50 hover:text-red-700 text-sm" aria-label="حذف"><i class="fa-regular fa-trash-can"></i></button>` : ''}</div>
    ${!can.edit(t) ? '<p class="text-[11px] text-ink-500 text-center mt-2"><i class="fa-solid fa-lock ml-1"></i>المدير وحده يعدّل أو يحذف المهام التي أسندها</p>' : ''}`;
  $('#commentForm').onsubmit = e => { e.preventDefault(); const v = $('#commentInput').value.trim(); if (!v) return;
    t.comments = t.comments || []; t.comments.push({ by: me(), text: v, at: Date.now(), readBy: [me()] }); save(); openTask(id); render();
    toast(`أُرسل التعليق إلى ${isMgr() ? person(t.assignee).name : 'المدير'}`, 'fa-paper-plane', 'text-brand-200');
    setTimeout(() => { const b = $('#drawerBody'); b.scrollTop = b.scrollHeight; }, 50); };
  $('#commentInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#commentForm').requestSubmit(); } });
  $('#stepForm').onsubmit = e => { e.preventDefault(); const v = $('#stepInput').value.trim(); if (!v) return; t.checklist = t.checklist || []; t.checklist.push({ t: v, done: false }); save(); openTask(id); render(); setTimeout(() => $('#stepInput').focus(), 0); };
  showDrawer();
}

function openForm(id, forWho) {
  const t = id ? tasks.find(x => x.id === id) : { title:'', desc:'', assignee: forWho || (isMgr() ? TEAM[0].id : me()), priority:'med', tag: TAGS[0], due: TODAY() };
  $('#drawerTitle').textContent = id ? 'تعديل المهمة' : 'مهمة جديدة';
  $('#drawerBody').innerHTML = `
    <form id="taskForm" class="space-y-4 fade-in" novalidate>
      <div><label for="fTitle" class="block text-sm font-bold mb-1.5">عنوان المهمة</label>
        <input id="fTitle" value="${esc(t.title)}" maxlength="90" placeholder="مثال: إعداد تقرير المبيعات" class="w-full bg-ink-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500">
        <p id="titleErr" class="hidden text-xs text-red-600 mt-1"><i class="fa-solid fa-circle-exclamation ml-1"></i>اكتب عنواناً من 3 أحرف على الأقل</p></div>
      <div><label for="fDesc" class="block text-sm font-bold mb-1.5">الوصف <span class="font-normal text-ink-500">(اختياري)</span></label>
        <textarea id="fDesc" rows="3" maxlength="400" class="w-full bg-ink-100 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none" placeholder="تفاصيل تساعد المسؤول على التنفيذ">${esc(t.desc)}</textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label for="fAssign" class="block text-sm font-bold mb-1.5">المسؤول</label>
          <select id="fAssign" ${!can.assign() ? 'disabled' : ''} class="w-full bg-ink-100 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">${TEAM.map(p => `<option value="${p.id}" ${t.assignee === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}</select></div>
        <div><label for="fDueDate" class="block text-sm font-bold mb-1.5">تاريخ الاستحقاق</label>
          <input id="fDueDate" type="date" value="${t.due}" class="w-full bg-ink-100 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"></div>
      </div>
      <div><div class="text-sm font-bold mb-1.5">الأولوية</div>
        <div class="grid grid-cols-3 gap-2">${Object.entries(PRIORITY).map(([k, p]) => `
          <label class="cursor-pointer"><input type="radio" name="fPri" value="${k}" class="peer sr-only" ${t.priority === k ? 'checked' : ''}>
            <span class="block text-center py-2.5 rounded-xl border-2 border-ink-200 peer-checked:border-brand-500 peer-checked:bg-brand-50 text-xs font-bold peer-focus-visible:ring-2 peer-focus-visible:ring-brand-500"><i class="${p.icon} ml-1"></i>${p.label}</span></label>`).join('')}</div></div>
      <div><label for="fTag" class="block text-sm font-bold mb-1.5">التصنيف</label>
        <select id="fTag" class="w-full bg-ink-100 rounded-xl px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">${TAGS.map(g => `<option ${t.tag === g ? 'selected' : ''}>${g}</option>`).join('')}</select></div>
    </form>`;
  $('#drawerFoot').innerHTML = `<button id="saveTask" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold">${id ? 'حفظ التعديلات' : 'إضافة المهمة'}</button>`;
  const submit = () => {
    const title = $('#fTitle').value.trim();
    if (title.length < 3) { $('#titleErr').classList.remove('hidden'); $('#fTitle').focus(); return; }
    const data = { title, desc: $('#fDesc').value.trim(), assignee: $('#fAssign').value, due: $('#fDueDate').value || TODAY(),
      priority: (document.querySelector('input[name=fPri]:checked') || {}).value || 'med', tag: $('#fTag').value };
    if (id) { Object.assign(tasks.find(x => x.id === id), data); save(); render(); openTask(id); toast('حُفظت التعديلات'); }
    else { const nt = Object.assign({ id: 'n' + Date.now(), status: 'todo', checklist: [], created: Date.now(), doneAt: null, createdBy: me(), seen: [me()], comments: [] }, data);
      tasks.push(nt); save(); render(); hideDrawer();
      toast(nt.assignee === me() ? 'أُضيفت المهمة إلى قائمتك' : `أُرسلت المهمة إلى ${person(nt.assignee).name} — ستظهر له عند دخوله`, 'fa-paper-plane', 'text-brand-200'); }
  };
  $('#saveTask').onclick = submit;
  $('#taskForm').onsubmit = e => { e.preventDefault(); submit(); };
  $('#fTitle').addEventListener('input', () => { if ($('#fTitle').value.trim().length >= 3) $('#titleErr').classList.add('hidden'); });
  showDrawer(); setTimeout(() => $('#fTitle').focus(), 300);
}

function confirmDelete(id) {
  const t = tasks.find(x => x.id === id);
  $('#confirmTitle').textContent = 'حذف المهمة؟'; $('#confirmText').textContent = `سيتم حذف "${t.title}" نهائياً.`;
  $('#confirmBox').classList.replace('hidden', 'flex');
  $('#confirmYes').onclick = () => { tasks = tasks.filter(x => x.id !== id); save(); $('#confirmBox').classList.replace('flex', 'hidden'); hideDrawer(); render(); toast('حُذفت المهمة', 'fa-trash-can', 'text-red-300'); };
}

function exportCsv() {
  const head = ['المهمة','المسؤول','الحالة','الأولوية','التصنيف','تاريخ الاستحقاق','تاريخ الإنجاز','متأخرة'];
  const rows = scoped().map(t => [t.title, person(t.assignee).name, STATUS[t.status].label, PRIORITY[t.priority].label, t.tag, t.due, t.doneAt ? ymd(new Date(t.doneAt)) : '', isOverdue(t) ? 'نعم' : '']);
  const csv = '﻿' + [head, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = `مهام-${TODAY()}.csv`; a.click();
  toast('صُدّرت المهام إلى ملف Excel', 'fa-file-arrow-down', 'text-brand-200');
}

/* ---------------- EVENTS ---------------- */
document.addEventListener('click', e => {
  if (!e.target.closest('#notifPanel') && !e.target.closest('#bellBtn')) $('#notifPanel').classList.add('hidden');
  const lg = e.target.closest('[data-login]'); if (lg) return login(lg.dataset.login);
  const asg = e.target.closest('[data-assign]'); if (asg) return openForm(null, asg.dataset.assign);
  const t = e.target.closest('[data-view],[data-mode],[data-open],[data-action],[data-jump],[data-person],[data-move],[data-set],[data-edit],[data-del],[data-delstep]');
  if (!t) return;
  const d = t.dataset;
  if (d.view) { state.view = d.view; saveUi(); render(); window.scrollTo(0, 0); }
  else if (d.mode) { state.mode = d.mode; saveUi(); renderTasks(); }
  else if (d.open) { $('#notifPanel').classList.add('hidden'); openTask(d.open); }
  else if (d.jump) { Object.assign(state, { view:'tasks', mode:'list', q:'', fAssignee:'all', fPriority:'all', fStatus:'open', fDue: d.jump === 'open' ? 'all' : d.jump }); saveUi(); render(); window.scrollTo(0, 0); }
  else if (d.person) { Object.assign(state, { view:'tasks', mode:'list', q:'', fAssignee: d.person, fPriority:'all', fStatus:'open', fDue:'all' }); saveUi(); render(); window.scrollTo(0, 0); }
  else if (d.move) setStatus(d.move, d.to);
  else if (d.set) setStatus(d.id, d.set);
  else if (d.edit) openForm(d.edit);
  else if (d.del) confirmDelete(d.del);
  else if (d.delstep !== undefined) { const tk = tasks.find(x => x.id === d.id); tk.checklist.splice(+d.delstep, 1); save(); openTask(d.id); render(); }
  else if (d.action === 'tour') startTour();
  else if (d.action === 'switch') showLogin();
  else if (d.action === 'notifs') { renderNotifs(); $('#notifPanel').classList.toggle('hidden'); }
  else if (d.action === 'readall') { notifications().forEach(n => markSeen(n.t)); renderNotifs(); render(); toast('عُلّمت كل الإشعارات كمقروءة'); }
  else if (d.action === 'new') openForm();
  else if (d.action === 'close') hideDrawer();
  else if (d.action === 'export') exportCsv();
  else if (d.action === 'clear') { Object.assign(state, { q:'', fAssignee:'all', fPriority:'all', fStatus:'open', fDue:'all' }); renderTasks(); }
  else if (d.action === 'cancel-confirm') $('#confirmBox').classList.replace('flex', 'hidden');
  else if (d.action === 'reset') { tasks = seed(); save(); render(); toast('أُعيدت البيانات التجريبية', 'fa-rotate', 'text-brand-200'); showLogin(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.toggle) setStatus(el.dataset.toggle, el.checked ? 'done' : 'todo');
  else if (el.dataset.step !== undefined) {
    const t = tasks.find(x => x.id === el.dataset.id); t.checklist[+el.dataset.step].done = el.checked;
    if (el.checked && t.status === 'todo') t.status = 'doing';
    save(); render();
    if (t.checklist.every(c => c.done) && t.status !== 'done') { toast('اكتملت كل الخطوات — هل تُعلّم المهمة كمنجزة؟', 'fa-list-check', 'text-brand-200'); }
    openTask(t.id);
  }
});
$('#overlay').onclick = hideDrawer;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && tourStep >= 0) { endTour(); return; }
  if (e.key === 'Escape') { if ($('#confirmBox').classList.contains('flex')) $('#confirmBox').classList.replace('flex', 'hidden'); else hideDrawer(); }
  if (e.key === 'n' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !drawerOpen()) { e.preventDefault(); openForm(); }
});


/* ---------------- ONBOARDING TOUR (short, skippable, contextual) ---------------- */
const TOUR = [
  { sel:'[data-tour="focus"]', icon:'fa-list-check', title:'هذه مهام اليوم', text:'كل ما يجب إنجازه اليوم، والمتأخر يظهر أولاً بعلامة حمراء.' },
  { sel:'[data-tour="focus"] .task-check', icon:'fa-square-check', title:'اضغط عند الإنجاز', text:'اضغط على المربع بجانب المهمة عندما تنتهي منها، فتنتقل إلى سجل الإنجازات.' },
  { sel:() => window.innerWidth < 640 ? '[data-tour="new-m"]' : '[data-tour="new"]', icon:'fa-plus', title:'أضف مهمة جديدة', text:'حدد المسؤول وتاريخ الاستحقاق والأولوية في خطوة واحدة.' },
  { sel:'[data-tour="role"]', icon:'fa-right-left', title:'جرّب كمدير وكموظف', text:'اضغط "تبديل الحساب" وادخل كموظف: سترى مهامه فقط، والمهام التي أرسلها له المدير تظهر بعلامة "جديدة لك" مع إشعار.' },
  { sel:'#bellBtn', icon:'fa-bell', title:'الإشعارات', text:'هنا يرى الموظف المهام الجديدة والتعليقات، ويرى المدير من أنجز مهامه.' },
];
let tourStep = -1;
function startTour() { if (state.view !== 'home') { state.view = 'home'; saveUi(); render(); } tourStep = 0; showTourStep(); }
function endTour() {
  tourStep = -1; $$('.tour-target').forEach(e => e.classList.remove('tour-target')); $('header').style.zIndex = '';
  $('#tourBg').classList.add('hidden'); $('#tourCard').classList.add('hidden'); store.set('injaz_tour', true);
}
function showTourStep() {
  $$('.tour-target').forEach(e => e.classList.remove('tour-target'));
  const st = TOUR[tourStep], sel = typeof st.sel === 'function' ? st.sel() : st.sel, el = document.querySelector(sel);
  $('header').style.zIndex = '';
  if (el) {
    if (getComputedStyle(el).position === 'static') el.style.position = 'relative';
    el.classList.add('tour-target'); el.scrollIntoView({ behavior:'smooth', block:'center' });
    if (el.closest('header')) $('header').style.zIndex = 56;
  }
  $('#tourBg').classList.remove('hidden');
  const last = tourStep === TOUR.length - 1;
  $('#tourCard').innerHTML = `
    <div class="flex items-center gap-3 mb-2"><span class="w-10 h-10 rounded-xl bg-brand-50 text-brand-700 flex items-center justify-center"><i class="fa-solid ${st.icon}"></i></span>
      <div class="flex-1"><div class="text-[11px] text-ink-500">الخطوة ${num(tourStep + 1)} من ${num(TOUR.length)}</div><div class="font-bold">${st.title}</div></div>
      <button data-tour-act="skip" class="text-xs text-ink-500 hover:text-ink-900">تخطي</button></div>
    <p class="text-sm text-ink-700 leading-6 mb-4">${st.text}</p>
    <div class="flex items-center gap-3">
      <div class="flex gap-1.5 flex-1">${TOUR.map((_, i) => `<span class="h-1.5 rounded-full ${i === tourStep ? 'w-6 bg-brand-600' : 'w-1.5 bg-ink-200'}"></span>`).join('')}</div>
      ${tourStep ? '<button data-tour-act="prev" class="px-3 py-2 rounded-lg text-sm font-bold text-ink-700 hover:bg-ink-100">السابق</button>' : ''}
      <button data-tour-act="next" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-bold">${last ? 'ابدأ العمل' : 'التالي'}</button>
    </div>`;
  $('#tourCard').classList.remove('hidden');
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tour-act]'); if (!b) return;
  const a = b.dataset.tourAct;
  if (a === 'skip') endTour(); else if (a === 'prev') { tourStep--; showTourStep(); }
  else if (tourStep >= TOUR.length - 1) endTour(); else { tourStep++; showTourStep(); }
});
$('#tourBg').onclick = endTour;

/* ---------------- INIT ---------------- */
render();
if (!store.get('injaz_logged', false)) showLogin();
else if (!store.get('injaz_tour', false)) setTimeout(startTour, 700);
</script>
</body>
</html>
